name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Unit tests
        run: uv run pytest tests/unit -v

      - name: Verify the agent graph imports (against the bundled sample project)
        run: uv run python -c "import adk_bmad.agent; print(adk_bmad.agent.root_agent.name)"
        env:
          GOOGLE_API_KEY: dummy-key-not-called-during-import
