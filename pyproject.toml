[project]
name = "adk-bmad"
version = "0.1.0"
description = "The BMAD-METHOD implementation loop, built as native Google ADK 2.0 agents and workflows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Eirikr" },
]
keywords = ["adk", "agent-development-kit", "bmad", "bmad-method", "agents", "gemini", "llm-workflows"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "google-adk>=2.5.0",
    "litellm>=1.93.0",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "ruamel-yaml>=0.19.1",
]

[project.urls]
Homepage = "https://github.com/iameirikr/adk-bmad"
Repository = "https://github.com/iameirikr/adk-bmad"
"BMAD-METHOD" = "https://github.com/bmad-code-org/BMAD-METHOD"
"Sibling project (Archon)" = "https://github.com/iameirikr/archon-bmad"

[project.scripts]
adk-bmad = "adk_bmad.cli:main"

[project.optional-dependencies]
mcp = ["google-adk[mcp]>=2.5.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
